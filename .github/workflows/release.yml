# A v* tag on main publishes every @bluewombat/* package. Authentication is
# npm trusted publishing (this workflow's OIDC identity), not a token.
# The first version of each package is published by hand so the publisher
# can be registered — docs/RUNBOOKS.md.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        name: The tag must match every package and sit on main
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          node scripts/release.mjs check "$tag"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not reachable from main — release only reviewed commits"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  verify:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run tsc
      - run: npm test

  publish:
    needs: [guard, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Publish packages that are not already on the registry
        run: node scripts/release.mjs publish "${{ needs.guard.outputs.version }}"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists — not creating again"
            exit 0
          fi
          {
            echo "\`@bluewombat/*\` ${version}."
            echo ""
            echo '```bash'
            echo "npm install @bluewombat/runtime @bluewombat/manager-github @bluewombat/slots"
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
